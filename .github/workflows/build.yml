name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build
        run: gradle --no-daemon clean build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: EnchantSelector-1.12.2
          path: build/libs/*.jar

      - name: Publish testable JAR release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-beta2
          name: Enchant Selector 1.12.2 v1.0.0-beta2
          prerelease: true
          files: build/libs/*.jar
          fail_on_unmatched_files: true
